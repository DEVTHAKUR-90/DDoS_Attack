name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pylint flake8

    - name: Lint with flake8
      run: |
        flake8 quantum_bruteforce_v9.py --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Basic syntax check
      run: |
        python -m py_compile quantum_bruteforce_v9.py
        python -m py_compile setup.py

    - name: Test imports
      run: |
        python -c "import socket, threading, ssl, json; print('Core imports OK')"

    - name: Version check
      run: |
        python quantum_bruteforce_v9.py --help > /dev/null 2>&1 || true
        echo "Version info extracted"

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Run security audit
      run: |
        pip install bandit
        bandit -r . -f csv -o bandit-report.csv || true

    - name: Check for hardcoded secrets
      run: |
        pip install detect-secrets
        detect-secrets scan --baseline .secrets.baseline || true

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Check README exists
      run: |
        if [ ! -f README.md ]; then echo "README.md missing"; exit 1; fi

    - name: Validate JSON config
      run: |
        python -m json.tool quantum_config.json > /dev/null

  release:
    needs: [test, security, docs]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v3

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Quantum Bruteforce ${{ github.ref }}
        body: |
          # Release Notes
          - See README.md for full changelog
          - Setup: `python3 setup.py`
          - Run: `python3 quantum_bruteforce_v9.py`
        draft: false
        prerelease: false
